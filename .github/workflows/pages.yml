# Veröffentlicht den Ordner app/ bei jedem Push auf main über GitHub Pages.
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Selbsttest: App mit Beispieldaten in einem Test-Browser öffnen und alle Reiter prüfen.
  # Schlägt er fehl, wird nicht veröffentlicht (die bisherige Version bleibt online).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test-Browser installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: App starten und testen
        run: |
          python3 -m http.server 8642 --bind 127.0.0.1 --directory app > /dev/null 2>&1 &
          sleep 2
          node tests/smoke.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Versionskennung in den Service Worker schreiben → Apps erkennen die neue Version
      - name: Version setzen
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/" app/sw.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5

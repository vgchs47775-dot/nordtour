# Veröffentlicht den Ordner app/ bei jedem Push auf main über GitHub Pages.
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Versionskennung in den Service Worker schreiben → Apps erkennen die neue Version
      - name: Version setzen
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/" app/sw.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5

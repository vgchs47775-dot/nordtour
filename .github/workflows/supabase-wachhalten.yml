# Ruft zweimal pro Woche Supabase auf, damit das kostenlose Projekt nicht wegen Inaktivität pausiert.
# Schlägt der Aufruf fehl, schickt GitHub eine E-Mail – dann im Supabase-Dashboard nachsehen.
# Hinweis: GitHub schaltet zeitgesteuerte Aufträge in Repos ab, in denen 60 Tage lang nichts passiert.
# Vorher kommt eine E-Mail; dann unter „Actions“ → „Supabase wach halten“ → „Enable workflow“ klicken.
name: Supabase wach halten

on:
  schedule:
    - cron: "17 6 * * 1,4"     # Montag und Donnerstag, 6:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anfragen
        env:
          # öffentliche Werte aus app/config.js (Publishable Key, kein Geheimnis)
          URL: https://hhzbxveismirmxkbuaom.supabase.co
          KEY: sb_publishable__0O5nnBXSGZ4-xy-03wmqw_A4jEKPgn
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o antwort.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
            echo "Versuch $i: HTTP $code – $(cat antwort.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 60
          done
          echo "Supabase antwortet nicht – ist das Projekt pausiert? Im Dashboard „Restore project“ klicken."
          exit 1
